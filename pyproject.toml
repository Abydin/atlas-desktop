[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-desktop"
version = "1.0.0"
description = "macOS desktop-control CLI: reads any app's UI via the Accessibility API and drives it by element name, not guessed pixel coordinates."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
desktop = "atlas_desktop.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas_desktop = ["*.js"]
